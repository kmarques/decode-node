<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decode Node - Démo SSE & Auteurs en Temps Réel</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 30, 49, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --accent-success: #10b981;
            --accent-error: #ef4444;
            --accent-warning: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #111827;
            --input-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            max-width: 800px;
            width: 100%;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            max-width: 1200px;
            width: 100%;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 0.75rem;
        }

        .status-pill {
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.05);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-connected {
            color: var(--accent-success);
            background: rgba(16, 185, 129, 0.1);
        }
        .status-connected .status-dot {
            background-color: var(--accent-success);
            box-shadow: 0 0 8px var(--accent-success);
        }

        .status-connecting {
            color: var(--accent-warning);
            background: rgba(245, 158, 11, 0.1);
        }
        .status-connecting .status-dot {
            background-color: var(--accent-warning);
            box-shadow: 0 0 8px var(--accent-warning);
        }

        .status-disconnected {
            color: var(--accent-error);
            background: rgba(239, 68, 68, 0.1);
        }
        .status-disconnected .status-dot {
            background-color: var(--accent-error);
            box-shadow: 0 0 8px var(--accent-error);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select, textarea {
            font-family: inherit;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            outline: none;
            transition: all 0.2s ease;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            font-family: inherit;
            background-color: var(--accent-color);
            color: white;
            font-weight: 600;
            border: none;
            padding: 0.85rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .author-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            max-height: 700px;
            padding-right: 0.5rem;
        }

        /* Styling custom scrollbar */
        .author-list::-webkit-scrollbar {
            width: 6px;
        }
        .author-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .author-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .author-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .author-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: all 0.3s ease;
        }

        .author-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            transform: scale(1.01);
            background: rgba(255, 255, 255, 0.05);
        }

        .author-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color) 0%, #a5b4fc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
        }

        .author-info {
            display: flex;
            flex-direction: column;
        }

        .author-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .author-id {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .articles-container {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .articles-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .article-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 0.5rem;
            padding: 0.75rem;
        }

        .article-item-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.15rem;
        }

        .article-item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .no-articles {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .no-authors {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Toast system */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 1000;
        }

        .toast {
            background: #1f2937;
            border-left: 4px solid var(--accent-color);
            color: var(--text-main);
            padding: 1rem 1.5rem;
            border-radius: 0.375rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 300px;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .toast.success {
            border-left-color: var(--accent-success);
        }

        .toast.error {
            border-left-color: var(--accent-error);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Pulse highlights for updates */
        @keyframes flash-green {
            0% { border-color: var(--accent-success); background: rgba(16, 185, 129, 0.05); }
            100% { border-color: rgba(255, 255, 255, 0.05); background: rgba(255, 255, 255, 0.03); }
        }

        @keyframes flash-blue {
            0% { border-color: var(--accent-color); background: rgba(99, 102, 241, 0.08); }
            100% { border-color: rgba(255, 255, 255, 0.05); background: rgba(255, 255, 255, 0.03); }
        }

        .flash-insert {
            animation: flash-green 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .flash-update {
            animation: flash-blue 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>
    <header>
        <h1>Decode Node Studio</h1>
        <p>Console CRUD & Démo de flux temps réel via Server-Sent Events (SSE)</p>
    </header>

    <main>
        <!-- Forms panel -->
        <div class="panel">
            <!-- User Form -->
            <div>
                <h2 class="section-title">Créer un Utilisateur</h2>
                <form id="userForm" style="margin-top: 1.5rem;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="firstname">Prénom</label>
                            <input type="text" id="firstname" required placeholder="John">
                        </div>
                        <div class="form-group">
                            <label for="lastname">Nom</label>
                            <input type="text" id="lastname" required placeholder="Doe">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="birthDate">Date de naissance</label>
                        <input type="date" id="birthDate" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Adresse Email</label>
                        <input type="email" id="email" required placeholder="john.doe@ecole-decode.fr">
                    </div>
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    <button type="submit">Créer l'utilisateur</button>
                </form>
            </div>

            <!-- Article Form -->
            <div>
                <h2 class="section-title">Créer un Article</h2>
                <form id="articleForm" style="margin-top: 1.5rem;">
                    <div class="form-group">
                        <label for="articleTitle">Titre de l'article</label>
                        <input type="text" id="articleTitle" required placeholder="Guide de Node.js">
                    </div>
                    <div class="form-group">
                        <label for="articleDesc">Description</label>
                        <textarea id="articleDesc" rows="3" required placeholder="Découvrez le fonctionnement des flux de données en temps réel..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="articleAuthor">Auteur (SQL User)</label>
                        <select id="articleAuthor" required>
                            <option value="">Sélectionnez un auteur...</option>
                        </select>
                    </div>
                    <button type="submit">Publier l'article</button>
                </form>
            </div>
        </div>

        <!-- SSE Dashboard panel -->
        <div class="panel">
            <div class="section-title">
                <span>Auteurs en Temps Réel (Mongo)</span>
                <span id="sseStatus" class="status-pill status-disconnected">
                    <span class="status-dot"></span>
                    <span id="sseStatusText">Déconnecté</span>
                </span>
            </div>
            
            <div id="authorList" class="author-list">
                <div class="no-authors">En attente de connexion SSE...</div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const API_BASE = 'http://localhost:3008';
        const userForm = document.getElementById('userForm');
        const articleForm = document.getElementById('articleForm');
        const articleAuthorSelect = document.getElementById('articleAuthor');
        const authorListContainer = document.getElementById('authorList');
        const sseStatus = document.getElementById('sseStatus');
        const sseStatusText = document.getElementById('sseStatusText');

        // Local cache of authors
        let authors = [];

        // Notification Helper
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${message}</span>
                <span style="cursor:pointer;margin-left:1rem;opacity:0.6" onclick="this.parentElement.remove()">×</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // 1. Fetch Sequelize Users to populate Article Form Author selection
        async function fetchUsers() {
            try {
                const res = await fetch(`${API_BASE}/users`);
                if (!res.ok) throw new Error('Impossible de charger les utilisateurs');
                const users = await res.json();
                
                // Populate options
                articleAuthorSelect.innerHTML = '<option value="">Sélectionnez un auteur...</option>';
                users.forEach(user => {
                    const opt = document.createElement('option');
                    opt.value = user.id;
                    opt.textContent = `${user.firstname} ${user.lastname} (${user.email})`;
                    articleAuthorSelect.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
                showToast(err.message, 'error');
            }
        }

        // 2. Submit User creation
        userForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                firstname: document.getElementById('firstname').value,
                lastname: document.getElementById('lastname').value,
                birthDate: document.getElementById('birthDate').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch(`${API_BASE}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!res.ok) {
                    const errTxt = await res.text();
                    throw new Error(errTxt || 'Erreur lors de la création de l\'utilisateur');
                }
                
                const newUser = await res.json();
                showToast(`Utilisateur ${newUser.firstname} créé avec succès !`);
                userForm.reset();
                fetchUsers(); // Refresh author dropdown
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // 3. Submit Article creation
        articleForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                title: document.getElementById('articleTitle').value,
                description: document.getElementById('articleDesc').value,
                userId: document.getElementById('articleAuthor').value
            };

            try {
                const res = await fetch(`${API_BASE}/articles`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!res.ok) {
                    const errTxt = await res.text();
                    throw new Error(errTxt || 'Erreur lors de la création de l\'article');
                }

                showToast('Article publié avec succès !');
                articleForm.reset();
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // 4. Render authors in the dashboard list
        function renderAuthors(highlightId = null, highlightClass = null) {
            if (authors.length === 0) {
                authorListContainer.innerHTML = '<div class="no-authors">Aucun auteur enregistré pour le moment.</div>';
                return;
            }

            authorListContainer.innerHTML = '';
            authors.forEach(author => {
                const initials = `${(author.firstname || '')[0] || ''}${(author.lastname || '')[0] || ''}`.toUpperCase();
                
                const card = document.createElement('div');
                card.id = `author-${author._id}`;
                card.className = 'author-card';
                if (highlightId === author._id && highlightClass) {
                    card.classList.add(highlightClass);
                }

                // Render Articles Sub-list
                let articlesHtml = '<div class="no-articles">Aucun article publié.</div>';
                if (author.articles && author.articles.length > 0) {
                    articlesHtml = author.articles.map(article => `
                        <div class="article-item">
                            <div class="article-item-title">${article.title || 'Sans titre'}</div>
                            <div class="article-item-desc">${article.description || ''}</div>
                        </div>
                    `).join('');
                }

                card.innerHTML = `
                    <div class="author-header">
                        <div class="author-avatar">${initials}</div>
                        <div class="author-info">
                            <span class="author-name">${author.firstname} ${author.lastname}</span>
                            <span class="author-id">ID MongoDB : ${author._id}</span>
                        </div>
                    </div>
                    <div class="articles-container">
                        <div class="articles-title">Derniers articles (Max 3)</div>
                        ${articlesHtml}
                    </div>
                `;
                authorListContainer.appendChild(card);
            });
        }

        // 5. Connect to SSE route subscribe
        function connectSSE() {
            setStatus('connecting');
            const source = new EventSource(`${API_BASE}/users/subscribe`);

            source.onopen = () => {
                setStatus('connected');
                showToast('Flux temps réel SSE connecté !', 'success');
            };

            source.onerror = (err) => {
                setStatus('disconnected');
                console.error("SSE connection error", err);
                source.close();
                // Reconnect attempt after 5 seconds
                setTimeout(connectSSE, 5000);
            };

            source.onmessage = (event) => {
                try {
                    const change = JSON.parse(event.data);
                    console.log('SSE message received:', change);
                    handleMongoChange(change);
                } catch (e) {
                    console.error("Error parsing SSE data:", e);
                }
            };
        }

        // Handle SSE operations from Mongoose Author watch stream
        function handleMongoChange(change) {
            const { operationType } = change;

            if (operationType === 'initial') {
                // Populate authors cache
                authors = change.data;
                renderAuthors();
                return;
            }

            if (operationType === 'insert') {
                const newAuthor = change.fullDocument;
                // Add if not already present
                if (!authors.find(a => a._id === newAuthor._id)) {
                    authors.push(newAuthor);
                    renderAuthors(newAuthor._id, 'flash-insert');
                }
            } else if (operationType === 'update' || operationType === 'replace') {
                const updatedAuthor = change.fullDocument;
                const index = authors.findIndex(a => a._id === updatedAuthor._id);
                if (index !== -1) {
                    authors[index] = updatedAuthor;
                } else {
                    authors.push(updatedAuthor);
                }
                renderAuthors(updatedAuthor._id, 'flash-update');
            } else if (operationType === 'delete') {
                const deletedId = change.documentKey._id;
                authors = authors.filter(a => a._id !== deletedId);
                renderAuthors();
            }
        }

        // Helper to update SSE status pill
        function setStatus(status) {
            sseStatus.className = 'status-pill';
            if (status === 'connected') {
                sseStatus.classList.add('status-connected');
                sseStatusText.textContent = 'Connecté';
            } else if (status === 'connecting') {
                sseStatus.classList.add('status-connecting');
                sseStatusText.textContent = 'Connexion...';
            } else {
                sseStatus.classList.add('status-disconnected');
                sseStatusText.textContent = 'Déconnecté';
            }
        }

        // Initial setup
        fetchUsers();
        connectSSE();
    </script>
</body>
</html>
