services:
  backend:
    image: node:alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    command: ['npm', 'run', 'dev']
    environment:
      PORT: 3000
      JWT_SECRET: gfhdxchgjkvhkj
      DATABASE_URL: postgres://user:password@database:5432/db_name
    ports:
      - 8000:3000

  database:
    image: postgres:17-alpine
    volumes:
      - node_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: db_name

volumes:
  node_pgdata:
    